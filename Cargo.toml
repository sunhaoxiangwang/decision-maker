[workspace]
resolver = "2"
members = ["crates/copilot-core", "crates/copilot-providers", "crates/copilot-server"]

[workspace.package]
edition = "2021"
version = "0.1.0"
license = "MIT"
publish = false

[workspace.dependencies]
tokio = { version = "1.54.1", default-features = false, features = ["rt-multi-thread", "macros", "net", "time", "sync", "signal", "fs", "io-util"] }
axum = { version = "0.8.9", default-features = false, features = ["http1", "json", "form", "query", "tokio", "tracing"] }
reqwest = { version = "0.13.5", default-features = false, features = ["native-tls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
maud = "0.27.0"
uuid = { version = "1.29.2", features = ["v4"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["fmt", "std"] }
